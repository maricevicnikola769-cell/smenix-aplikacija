name: Napravi APK

on:
  push:
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: apk-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Gradi APK
        run: gradle assembleDebug --no-daemon

      - name: Preimenuj APK
        run: cp app/build/outputs/apk/debug/app-debug.apk aplikacija.apk

      - name: Sacuvaj kao artefakt
        uses: actions/upload-artifact@v4
        with:
          name: aplikacija-apk
          path: aplikacija.apk

      - name: Objavi u Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Verzija ${{ github.run_number }}
          files: aplikacija.apk
